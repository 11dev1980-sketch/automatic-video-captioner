<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Premium PWA Icon Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            color: #000;
        }
        canvas {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
        }
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            background: #000;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        button:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Premium Monochrome Icon Generator</h1>
        <canvas id="canvas" width="1024" height="1024"></canvas>
        <div class="buttons">
            <button onclick="downloadIcon(1024, 'icon-1024.png')">Download 1024×1024</button>
            <button onclick="downloadIcon(512, 'icon-512.png')">Download 512×512</button>
            <button onclick="downloadIcon(192, 'icon-192.png')">Download 192×192</button>
            <button onclick="downloadIcon(48, 'favicon.png')">Download 48×48 (Favicon)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function drawIcon() {
            const size = 1024;
            const center = size / 2;
            
            // White background
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, size, size);
            
            // Subtle shadow effect
            for (let i = 0; i < 5; i++) {
                const alpha = 0.04 - i * 0.008;
                const offset = i * 2;
                const shadowSize = 450 + offset;
                
                ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                roundRect(ctx, center - shadowSize, center - shadowSize, 
                         shadowSize * 2, shadowSize * 2, 120);
                ctx.fill();
            }
            
            // Main black rounded square
            ctx.fillStyle = '#000000';
            roundRect(ctx, center - 440, center - 440, 880, 880, 110);
            ctx.fill();
            
            // Elegant play button
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            const playSize = 160;
            const playOffsetX = 20;
            ctx.moveTo(center - playSize + playOffsetX, center - playSize);
            ctx.lineTo(center - playSize + playOffsetX, center + playSize);
            ctx.lineTo(center + playSize + playOffsetX, center);
            ctx.closePath();
            ctx.fill();
            
            // Minimalist Arabic calligraphy curves
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 16;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Top curve
            ctx.beginPath();
            const curveY = center - 200;
            const curveStartX = center - 150;
            const curveEndX = center + 150;
            
            for (let i = 0; i <= 30; i++) {
                const t = i / 30;
                const x = curveStartX + (curveEndX - curveStartX) * t;
                const y = curveY - 40 * (4 * t * (1 - t));
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // Bottom curve
            ctx.beginPath();
            const curveYBottom = center + 200;
            
            for (let i = 0; i <= 30; i++) {
                const t = i / 30;
                const x = curveStartX + (curveEndX - curveStartX) * t;
                const y = curveYBottom + 40 * (4 * t * (1 - t));
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // Corner accent marks (premium detail)
            ctx.lineWidth = 6;
            const accentSize = 30;
            const accentOffset = 340;
            
            // Top-left
            ctx.beginPath();
            ctx.moveTo(center - accentOffset, center - accentOffset);
            ctx.lineTo(center - accentOffset + accentSize, center - accentOffset);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(center - accentOffset, center - accentOffset);
            ctx.lineTo(center - accentOffset, center - accentOffset + accentSize);
            ctx.stroke();
            
            // Top-right
            ctx.beginPath();
            ctx.moveTo(center + accentOffset, center - accentOffset);
            ctx.lineTo(center + accentOffset - accentSize, center - accentOffset);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(center + accentOffset, center - accentOffset);
            ctx.lineTo(center + accentOffset, center - accentOffset + accentSize);
            ctx.stroke();
            
            // Bottom-left
            ctx.beginPath();
            ctx.moveTo(center - accentOffset, center + accentOffset);
            ctx.lineTo(center - accentOffset + accentSize, center + accentOffset);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(center - accentOffset, center + accentOffset);
            ctx.lineTo(center - accentOffset, center + accentOffset - accentSize);
            ctx.stroke();
            
            // Bottom-right
            ctx.beginPath();
            ctx.moveTo(center + accentOffset, center + accentOffset);
            ctx.lineTo(center + accentOffset - accentSize, center + accentOffset);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(center + accentOffset, center + accentOffset);
            ctx.lineTo(center + accentOffset, center + accentOffset - accentSize);
            ctx.stroke();
        }
        
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }
        
        function downloadIcon(size, filename) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCtx.imageSmoothingEnabled = true;
            tempCtx.imageSmoothingQuality = 'high';
            tempCtx.drawImage(canvas, 0, 0, size, size);
            
            tempCanvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/png');
        }
        
        drawIcon();
    </script>
</body>
</html>
